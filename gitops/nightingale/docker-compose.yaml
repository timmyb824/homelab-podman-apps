services:
  nightingale:
    image: docker.io/flashcatcloud/nightingale:9.3.0
    container_name: nightingale
    hostname: nightingale
    restart: always
    environment:
      GIN_MODE: release
      TZ: America/New_York
    volumes:
      - ./etc-nightingale:/app/etc
    ports:
      - "17000:17000"
      - "20090:20090"
    command:
      - /app/n9e

