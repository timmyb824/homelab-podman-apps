---
services:
  dockhand:
    image: docker.io/fnsys/dockhand:v1.0.37
    container_name: dockhand
    restart: unless-stopped
    environment:
      - PUID:1000
      - PGID:1000
    ports:
      - "3007:3000"
    volumes:
      - /run/user/${USER_ID-1000}/podman/podman.sock:/var/run/docker.sock:z
      - dockhand_data:/app/data

volumes:
  dockhand_data:
