---
services:
  web:
    container_name: scrutiny-web
    restart: unless-stopped
    image: "ghcr.io/analogj/scrutiny:master-web@sha256:05c8c28c25f63c0fb0361f2a5c3897e086076d4e9a3e75bd781682c28ee452c2"
    ports:
      - "8091:8080"
    volumes:
      - "./config:/opt/scrutiny/config"
      - "./scrutiny.yaml:/opt/scrutiny/config/scrutiny.yaml"
    healthcheck:
      disable: true
