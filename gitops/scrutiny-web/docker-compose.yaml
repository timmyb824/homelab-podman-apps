---
services:
  web:
    container_name: scrutiny-web
    restart: unless-stopped
    image: ghcr.io/analogj/scrutiny:v0.9.2-web
    ports:
      - "8091:8080"
    volumes:
      - "./config:/opt/scrutiny/config"
      - "./scrutiny.yaml:/opt/scrutiny/config/scrutiny.yaml"
    healthcheck:
      disable: true
