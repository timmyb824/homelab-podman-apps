---
services:
  web:
    container_name: scrutiny-web
    restart: unless-stopped
    image: "ghcr.io/analogj/scrutiny:master-web@sha256:a5442d604f391ac5391dece37922a2b3cdc0abe94e8f4def2f112a630590f745"
    ports:
      - "8091:8080"
    volumes:
      - "./config:/opt/scrutiny/config"
      - "./scrutiny.yaml:/opt/scrutiny/config/scrutiny.yaml"
    healthcheck:
      disable: true
