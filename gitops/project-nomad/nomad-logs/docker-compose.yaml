services:
  logs:
    container_name: nomad-logs
    image: docker.io/amir20/dozzle:v11.5.0
    security_opt:
      - apparmor:unconfined
      - "label=type:container_runtime_t"
    volumes:
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:z
    environment:
      - DOZZLE_ENABLE_ACTIONS=false
      - DOZZLE_ENABLE_SHELL=false
    ports:
      - 9999:8080
    restart: unless-stopped
    networks:
      - shared

networks:
  shared:
    name: shared
