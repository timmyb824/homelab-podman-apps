name: project-nomad

# Cap every container's log at 3 x 10 MB. Docker's default json-file log never rotates, and on a
# small root disk an unbounded log can fill / and take MySQL down with it (#1412).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  disk-collector:
    image: ghcr.io/crosstalk-solutions/project-nomad-disk-collector:latest
    pull_policy: always
    container_name: nomad-disk-collector
    logging: *default-logging
    volumes:
      - /:/host:Z  # Read-only view of host FS with rslave propagation so /sys and /proc submounts are visible
      - ../storage:/storage
    networks:
      - shared

networks:
  shared:
    name: shared
